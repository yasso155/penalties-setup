<style>
/* Layout: two columns. Left: steps (Penalties, Fare class, Legs, Preview). Right: current file and export. Orange = Modification, red = Refund. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#14202E; --muted:#5A6778; --line:#D3DAE4;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --good:#1D7A4B; --warn:#A85A07; --bad:#B3261E;
  --mod:#C75B07; --mod-soft:#FDEBD9; --ref:#C62F2A; --ref-soft:#FBE3E1;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1520; --surface:#16202C; --surface-2:#1C2837; --ink:#E5EBF3; --muted:#92A0B3; --line:#2B3A4D;
    --accent:#6FA4F3; --accent-ink:#0B1626; --accent-soft:#1D2D45;
    --good:#4CC38A; --warn:#E0A04A; --bad:#F0827A; --mod:#F29A45; --mod-soft:#3A2A1A; --ref:#F2766E; --ref-soft:#3C1F1F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#16202C; --surface-2:#1C2837; --ink:#E5EBF3; --muted:#92A0B3; --line:#2B3A4D;
  --accent:#6FA4F3; --accent-ink:#0B1626; --accent-soft:#1D2D45;
  --good:#4CC38A; --warn:#E0A04A; --bad:#F0827A; --mod:#F29A45; --mod-soft:#3A2A1A; --ref:#F2766E; --ref-soft:#3C1F1F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;

.shell{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}

.sub{margin:2px 0 0;color:var(--muted);font-size:14px}

.brand-dark{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-light{display:none!important}:root:not([data-theme="light"]) .brand-dark{display:block!important}}
:root[data-theme="dark"] .brand-light{display:none!important}
:root[data-theme="dark"] .brand-dark{display:block!important}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.col-side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.card-h h2{margin:0;font-size:16px;font-weight:600}
.step{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:13px;font-weight:600;font-family:var(--f-mono)}
.card-h .hint{margin-inline-start:auto;color:var(--muted);font-size:13px}
input[type=search],input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:38px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.pick-row:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.num{direction:ltr;text-align:left;font-family:var(--f-mono)}
.num.bad{border-color:var(--bad)}
.sub2 .v-mod{color:var(--mod)} .sub2 .v-ref{color:var(--ref)}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:7px 12px;min-height:36px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.link{border:0;background:none;color:var(--accent);padding:2px 6px;min-height:0}
.quick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pick-tools .count{margin-inline-start:auto;color:var(--muted);font-size:13px}
.pick-list{max-height:232px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.pick-row{display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:34px;cursor:pointer;border-bottom:1px solid var(--line)}
.pick-row:last-child{border-bottom:0}
.pick-row:hover{background:var(--accent-soft)}
.pick-row input{width:16px;height:16px;flex:none;accent-color:var(--accent)}
.pick-row .latin{direction:ltr;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
.empty-note{padding:14px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 4px;min-height:0;color:var(--muted);font-size:16px;line-height:1}
.pen-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pen-box{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2);min-width:0}
.pen-box h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.pen-box h3 .link{margin-inline-start:auto;font-size:12.5px}
.f-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;margin-bottom:2px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.opts{display:flex;gap:16px 24px;flex-wrap:wrap;margin-top:14px;align-items:flex-end}
.opts .fld{min-width:140px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:38px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.fixed-note{color:var(--muted);font-size:13px;margin-top:10px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);font-weight:500;color:var(--muted);font-size:12.5px}
tr:last-child td{border-bottom:0}
td.latin,th.latin{direction:ltr;text-align:left}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--accent-soft)}
.tag.after{background:transparent;border:1px solid var(--line)}
.add-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.add-bar .why{color:var(--muted);font-size:13px;flex:1;min-width:180px}
.batch-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.batch-item{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);display:flex;gap:8px;align-items:flex-start}
.batch-item .meta{flex:1;min-width:0;font-size:13.5px}
.batch-item .meta b{font-weight:600}
.batch-item .sub2{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.big{font-size:30px;font-weight:600;font-family:var(--f-mono);line-height:1.1}
.tot{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.tot small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-body);font-weight:400}
.status{min-height:22px;font-size:13px;margin-top:8px}
.status.ok{color:var(--good)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.pen-card{border:1.5px solid var(--accent);padding:20px;display:flex;flex-direction:column;gap:16px}
.pen-card .card-h{margin:0}
.cur-wrap{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.cur-wrap select{width:96px}
.pen-card .pen-box{padding:16px}
.pen-card .pen-box h3{font-size:15px;margin-bottom:6px}
.pen-card .num{font-size:20px;min-height:48px}
.pen-card select{min-height:48px}
.pen-card .f-row{grid-template-columns:minmax(0,1fr) 64px;align-items:center}
.unit{color:var(--muted,#667);font-size:13px;font-weight:600}
.lbl.mod,.th-mod{color:var(--mod)} .lbl.ref,.th-ref{color:var(--ref)}
.lbl.mod,.lbl.ref{font-weight:600}
.num.mod{border-color:var(--mod);background:var(--mod-soft)} .num.ref{border-color:var(--ref);background:var(--ref-soft)}
.num.mod:focus-visible{outline-color:var(--mod)} .num.ref:focus-visible{outline-color:var(--ref)}
.num.bad{border-color:var(--bad)}
td.v-mod{color:var(--mod);font-weight:500} td.v-ref{color:var(--ref);font-weight:500}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:13px}
.act:empty{display:none}
.existing{border:1px dashed var(--line);border-radius:8px;padding:12px;margin:14px 0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.ex-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex-s{overflow-wrap:anywhere}.ex-s.good{color:var(--good)}.ex-s.warn{color:var(--warn)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tag.upd{background:var(--accent-soft)}
.tag.chg{background:var(--mod-soft);color:var(--mod)}
.tag.same{background:transparent;border:1px solid var(--line);color:var(--muted)}
.was{color:var(--muted);font-size:11.5px;font-weight:400;text-decoration:line-through}
.tag.add{background:transparent;border:1px solid var(--good);color:var(--good)}
.agr-b{flex:none;font-size:11px;line-height:1.5;padding:0 7px;border-radius:999px;border:1px solid var(--accent);color:var(--accent)}
.agr-hint{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);font-size:13px;display:flex;flex-direction:column;gap:8px}
.agr-hint .h{font-weight:600}
.agr-hint .ln{overflow-wrap:anywhere}
.agr-hint .warn{color:var(--warn)} .agr-hint .ok{color:var(--good)}
.agr-hint .v-mod{color:var(--mod);font-weight:600} .agr-hint .v-ref{color:var(--ref);font-weight:600}
.sdg-rates{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}
.sdg-rates .t{font-weight:600}
.sdg-rates label{display:flex;align-items:center;gap:6px}
.sdg-rates input{width:110px;padding:6px 8px;font-size:14px}
.agr-btns{display:flex;gap:8px;flex-wrap:wrap}.agr-btns:empty{display:none}
.noshow-box h3{display:flex;align-items:center;gap:10px}
.noshow-box .inc{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;cursor:pointer}
.noshow-box .inc input{width:16px;height:16px;accent-color:var(--accent)}
.ns-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.noshow-box.off .ns-grid{opacity:.5}
.tag.ns{background:var(--ink);color:var(--bg)}
@media (max-width:560px){.ns-grid{grid-template-columns:minmax(0,1fr)}}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;min-height:56px;text-align:start}
.quick button b{font-family:var(--f-mono);font-size:20px;line-height:1.2}
.quick button span{font-size:12px;opacity:.8}
.quick button.all{grid-column:1/-1;align-items:center;justify-content:center;min-height:40px;font-weight:500}
details.more>summary{cursor:pointer;color:var(--accent);padding:4px 0;min-height:32px}
details.more[open]>summary{margin-bottom:6px}
@media (max-width:900px){.pair{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .col-side{position:static}
}
@media (max-width:560px){
  .pen-grid{grid-template-columns:minmax(0,1fr)}
  h1{font-size:22px}
}
</style>

function ruleRows(rule){
  const out=[];
  // Classic: Before and After, 0 to 10000 hours. NoShow: Before only, 0 to 0 hours (matches the real export).
  const sets=[{ptype:'Classic',bas:BA_ORDER,from:0,to:10000,get:ba=>rule.pen[ba]}];
  if (rule.noshow) sets.push({ptype:'NoShow',bas:['Before'],from:0,to:0,get:()=>rule.noshow});
  for (const st of sets) for (const ba of st.bas){
    const p = st.get(ba);
    for (const fare of new Set(rule.fares.map(fixFare))) for (const leg of rule.legs) for (const pax of PAX_WITH_PENALTY){
      out.push({ptype:st.ptype,from:st.from,to:st.to,fare,leg,pax,ba,cur:rule.cur,
        modAmt:p.mod.amt,modMode:p.mod.mode,refAmt:p.ref.amt,refMode:p.ref.mode});
    }
  }
  return out;
}
/* If the same (Penalty Type, Farebasis, Leg, Passenger, Before/After, Currency) repeats, the later rule replaces the earlier one in place */
/* Penalty identity: the same key means the same penalty in the booking system */
function rowKey(ptype,fare,leg,pax,atype,ba,from,to,cur){
  return [ptype,fare,leg,pax,atype,ba,Number(from),Number(to),cur].map(x=>String(x).trim()).join('|');
}
/* Existing penalty (found by key) => Update with its ID. Not found => Add, no ID. */
function annotate(rows,existing){
  for (const r of rows){
    const ex=existing?existing.get(rowKey(r.ptype,r.fare,r.leg,r.pax,FIXED.atype,r.ba,r.from,r.to,r.cur)):undefined;
    r.prev=undefined; r.modDiff=r.refDiff=false;
    if (ex){
      r.action='Update'; r.id=ex.id; r.prev=ex;
      r.modDiff=Number(ex.modAmt)!==Number(r.modAmt)||ex.modMode!==r.modMode;
      r.refDiff=Number(ex.refAmt)!==Number(r.refAmt)||ex.refMode!==r.refMode;
      r.change=(r.modDiff||r.refDiff)?'Changed':'Same';
    } else {r.action='Add'; r.id=undefined; r.change='New';}
  }
  return rows;
}
function generateRows(batch,existing){
  const map=new Map(); let overridden=0;
  for (const rule of batch) for (const r of ruleRows(rule)){
    const key=[r.ptype,r.fare,r.leg,r.pax,r.ba,r.cur].join('|');
    if (map.has(key)) overridden++;
    map.set(key,r);
  }
  const rows=annotate([...map.values()],existing);
  const n=k=>rows.filter(r=>r.change===k).length;
  return {rows,overridden,changed:n('Changed'),same:n('Same'),adds:n('New'),updates:n('Changed')+n('Same')};
}
/* Read an existing export (Penalties sheet with IDs) into Map(key -> ID) */
function parseExisting(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets['Penalties']||wb.Sheets[wb.SheetNames[0]];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const h=(data[0]||[]).map(x=>x==null?'':String(x).trim());
  const ix=n=>h.indexOf(n);
  const need=['ID','Farebasis','Leg','Passenger Type','Penalty Type','Application Type','Between(hours)','And(hours)','Before or After flight','Currency','Modification pen amount','Modification pen mode','Refund pen amount','Refund pen mode'];
  const miss=need.filter(n=>ix(n)<0);
  if (miss.length) throw new Error('Missing columns: '+miss.join(', '));
  const map=new Map(); let count=0;
  for (let i=1;i<data.length;i++){
    const r=data[i],id=r[ix('ID')];
    if (id===null||id===''||r[ix('Farebasis')]==null) continue;
    const key=rowKey(r[ix('Penalty Type')],r[ix('Farebasis')],r[ix('Leg')],r[ix('Passenger Type')],r[ix('Application Type')],r[ix('Before or After flight')],r[ix('Between(hours)')],r[ix('And(hours)')],r[ix('Currency')]);
    if (!map.has(key)) map.set(key,{id,modAmt:r[ix('Modification pen amount')],modMode:r[ix('Modification pen mode')],refAmt:r[ix('Refund pen amount')],refMode:r[ix('Refund pen mode')]});
    count++;
  }
  return {map,count};
}
function rowCells(r,n){
  const v={A:r.action,D:r.fare,F:r.leg,H:r.pax,J:r.ptype,L:FIXED.atype,N:r.from,O:r.to,
    P:r.ba,R:r.cur,T:r.modAmt,U:r.modMode,W:r.refAmt,X:r.refMode};
  if (r.id!==undefined) v.C=r.id;
  const cells={};
  for (const L in v) cells[L]={t:typeof v[L]==='number'?'n':'s',v:v[L]};
  for (const L in LOOKUP){
    const [src,g]=LOOKUP[L]; const code=CODE[g].get(v[src]);
    const lo=colLetter(GROUPS.find(x=>x[0]===g)[1]), hi=colLetter(GROUPS.find(x=>x[0]===g)[1]+1);
    const f=`IFERROR(VLOOKUP(${src}${n},ReferenceValues!$${lo}$2:$${hi}$${REF[g].length+1},2,0),"")`;
    cells[L]={t:typeof code==='number'?'n':'s',v:code===undefined?'':code,f};
  }
  return cells;
}
function buildWorkbook(rows){
  const ws={}; COLS.forEach((h,i)=>{ws[colLetter(i)+'1']={t:'s',v:h};});
  rows.forEach((r,i)=>{const n=i+2,c=rowCells(r,n);for(const L in c)ws[L+n]=c[L];});
  ws['!ref']='A1:Y'+(rows.length+1);
  ws['!cols']=COLS.map((h,i)=>({wch:[3,8,9,10,13,14,15,24].includes(i)?22:Math.max(10,h.length+2)}));
  const rf={}; let maxLen=0;
  for (const [k,c0] of GROUPS){
    rf[colLetter(c0)+'1']={t:'s',v:'Label'}; rf[colLetter(c0+1)+'1']={t:'s',v:'Code'};
    REF[k].forEach(([l,c],i)=>{
      rf[colLetter(c0)+(i+2)]={t:'s',v:l};
      rf[colLetter(c0+1)+(i+2)]={t:typeof c==='number'?'n':'s',v:c};
    });
    maxLen=Math.max(maxLen,REF[k].length);
  }
  rf['!ref']='A1:Z'+(maxLen+1);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Penalties');
  XLSX.utils.book_append_sheet(wb,rf,'ReferenceValues');
  return wb;
}
function toXlsxBuffer(rows){return XLSX.write(buildWorkbook(rows),{bookType:'xlsx',type:'array'});}

/* ===== Agreement (J4 / 3T, Winter 26): penalties by destination group =====
   Outbound = leg leaves KRT or PZU. Inbound = leg returns to KRT or PZU. Values: [Modify, Refund, No-show]. */
let AGREEMENT=[
  {name:'CAI',dests:['CAI'],
   out:{USD:[30,50,75]}, in:{USD:[20,30,40]}},
  {name:'EBB / JUB / MCT / DOH / KWI',dests:['EBB','JUB','MCT','DOH','KWI'],
   out:{USD:[50,75,75]}, in:{USD:[50,75,75]}},
  {name:'JED / RUH / TUU / ELQ / AHB / DMM / TIF / MED',dests:['JED','RUH','TUU','ELQ','AHB','DMM','TIF','MED'],
   out:{USD:[30,50,75],SAR:[110,185,280]},
   in:{USD:[25,40,75],SAR:[90,150,280]}},
  {name:'ADD / ASM',dests:['ADD','ASM'],
   out:{USD:[30,50,75]}, in:{USD:[25,40,75]}},
];
const AGREEMENT_DOMESTIC={name:'Domestic',vals:{USD:[20,35,50]},
  legs:['PZU-KRT','KRT-PZU','PZU-DOG','DOG-PZU','PZU-KSL','KSL-PZU','KRT-DOG','DOG-KRT','KRT-KSL','KSL-KRT']};
const AGR_LEG=new Map();   // leg -> {group, dir, vals}

/* Rates per 1 USD and rounding step per currency. Converted values are rounded DOWN to the step.
   Explicit agreement values (SAR, SDG for the JED group) take priority over conversion. */
const RATES={EGP:[48,10],JOD:[0.7,0.5],SAR:[3.75,5],QAR:[3.65,5],OMR:[0.3846,0.5],AED:[3.67,5],KWD:[0.30303,0.5]};
const SDG_STEP=1000;   // SDG rate is typed by the user, separately for Outbound and Inbound
function convUSD(usd,cur){const [rate,step]=RATES[cur];return +(Math.floor(usd*rate/step+1e-9)*step).toFixed(4);}

function rebuildAgreement(){
  AGR_LEG.clear();
  for (const g of AGREEMENT) for (const d of g.dests) for (const o of ['KRT','PZU']){
    for (const [leg,dir,vals] of [[`${o}-${d}`,'Outbound',g.out],[`${d}-${o}`,'Inbound',g.in]])
      if (CODE.leg && CODE.leg.has(leg)) AGR_LEG.set(leg,{group:g.name,dir,vals});
  }
  for (const leg of AGREEMENT_DOMESTIC.legs) if (CODE.leg && CODE.leg.has(leg)) AGR_LEG.set(leg,{group:AGREEMENT_DOMESTIC.name,dir:'Both',vals:AGREEMENT_DOMESTIC.vals});
  for (const a of AGR_LEG.values()){
    const u=a.vals.USD; if(!u)continue;
    for(const cur of Object.keys(RATES)) if(!a.vals[cur]) a.vals[cur]=u.map(x=>convUSD(x,cur));
  }
}
rebuildAgreement();
window.updateAgreement = function(newAgr){
  if(Array.isArray(newAgr)&&newAgr.length){
    AGREEMENT = newAgr;
    rebuildAgreement();
    if(window.PenApp&&window.PenApp.refresh)window.PenApp.refresh();
  }
};
/* Values of an agreement leg in a currency (SDG follows the typed rates; Both/domestic uses Outbound). */
function agrVals(a,cur){
  if(cur==='SDG'){const u=a.vals.USD,rate=a.dir==='Inbound'?state.sdgIn:state.sdgOut;
    if(!u||!(rate>0))return null;
    return u.map(x=>+(Math.floor(x*rate/SDG_STEP+1e-9)*SDG_STEP).toFixed(4));}
  return a.vals[cur];
}

/* ===== Validation ===== */
function parseAmt(s){
  s=String(s).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.');
  if(s==='')return null; const n=Number(s); return Number.isFinite(n)&&n>=0?n:NaN;
}
function amtError(raw,mode){
  const n=parseAmt(raw);
  if(n===null) return 'Required';
  if(Number.isNaN(n)) return 'Invalid number';
  if(mode==='Percentage'&&n>100) return 'Percentage is over 100';
  return '';
}

<script>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='penalties-builder-v1';

const state={

    if(ENABLED_CURRENCIES.includes(s.cur))state.cur=s.cur;

}
function ensureNoShow(){if(!state.pen.NoShow)state.pen.NoShow=blankPen();}
const EX_KEY='penalties-existing-v3';
function loadExisting(){try{const o=JSON.parse(localStorage.getItem(EX_KEY)||'null');if(o&&Array.isArray(o.pairs)){state.imported=true;state.existing=new Map(o.pairs.map(([k,v])=>[k,{id:v[0],modAmt:v[1],modMode:v[2],refAmt:v[3],refMode:v[4]}]));state.existingName=o.name||'';}}catch(e){}}
function saveExisting(){try{if(state.existing.size)localStorage.setItem(EX_KEY,JSON.stringify({name:state.existingName,pairs:[...state.existing].map(([k,v])=>[k,[v.id,v.modAmt,v.modMode,v.refAmt,v.refMode]])}));else localStorage.removeItem(EX_KEY);}catch(e){}
  try{if(window.PenHooks&&PenHooks.onExisting)PenHooks.onExisting();}catch(e){}}

    noshowOn:state.noshowOn,startId:state.startId,batch:state.batch}));}catch(e){}

/* --- Picker (search + multi-select) --- */
function makePicker(root,items,set,placeholder,onChange,badge){
  root.innerHTML=`<input type="search" class="latin" placeholder="${placeholder}" aria-label="${placeholder}" dir="ltr">
    <div class="pick-tools"><button type="button" data-a="all">Select all shown</button><button type="button" data-a="none">Clear selection</button><span class="count"></span></div>
    <div class="pick-list" role="group"></div><div class="chips"></div>`;
  const q=root.querySelector('input'),list=root.querySelector('.pick-list'),chips=root.querySelector('.chips'),cnt=root.querySelector('.count');
  let shown=items;
  function drawChips(){
    chips.innerHTML=[...set].map(l=>`<span class="chip"><span class="latin">${esc(l)}</span><button type="button" data-rm="${esc(l)}" aria-label="Remove ${esc(l)}">×</button></span>`).join('');
    cnt.textContent=`${set.size} selected of ${items.length}`;
  }
  function drawList(){
    const t=q.value.trim().toLowerCase();
    shown=t?items.filter(l=>l.toLowerCase().includes(t)):items;
    list.innerHTML=shown.length?shown.map(l=>`<label class="pick-row"><input type="checkbox" value="${esc(l)}"${set.has(l)?' checked':''}><span class="latin">${esc(l)}</span>${badge?badge(l):''}</label>`).join('')
      :'<div class="empty-note">No matches.</div>';
  }
  q.addEventListener('input',drawList);
  list.addEventListener('change',e=>{const c=e.target;if(c.type!=='checkbox')return;c.checked?set.add(c.value):set.delete(c.value);drawChips();onChange();});
  chips.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;set.delete(b.dataset.rm);drawList();drawChips();onChange();});
  root.querySelector('.pick-tools').addEventListener('click',e=>{
    const a=e.target.dataset.a;if(!a)return;
    if(a==='all')shown.forEach(l=>set.add(l));else set.clear();
    drawList();drawChips();onChange();
  });
  drawList();drawChips();
  return {redraw(){drawList();drawChips();},setItems(n){items=n;drawList();drawChips();}};
}

function modeOpts(sel){return REF.mode.map(([l])=>`<option value="${l}"${l===sel?' selected':''}>${l==='Value'?'Value (amount)':'Percentage (%)'}</option>`).join('');}

/* --- Draft / validation --- */
function penErrors(){
  const errs={};
  for(const ba of BA_ORDER)for(const k of ['mod','ref']){

  for(const k of ['mod','ref']){const p=state.pen.NoShow[k]; errs['NoShow-'+k]=state.noshowOn?amtError(p.amt,p.mode):'';}
  return errs;
}
function draftRule(){
  const num=x=>({amt:parseAmt(x.amt),mode:x.mode});
  const pen={};for(const ba of BA_ORDER)pen[ba]={mod:num(state.pen[ba].mod),ref:num(state.pen[ba].ref)};
  const noshow=state.noshowOn?{mod:num(state.pen.NoShow.mod),ref:num(state.pen.NoShow.ref)}:null;
  return {fares:[...state.fares],legs:[...state.legs],pen,noshow,cur:state.cur};
}

function actSummary(rows){const n=k=>rows.filter(r=>r.change===k).length;return `${n('Changed')} changed, ${n('Same')} same, ${n('New')} new`;}

    show.map(r=>`<tr><td><span class="tag ${r.action==='Add'?'add':'upd'} latin">${r.action}</span></td><td><span class="tag ${r.change==='Changed'?'chg':r.change==='Same'?'same':'add'} latin">${r.change}</span></td><td class="latin" title="${esc(r.fare)}">${esc(shortFare(r.fare))}</td><td class="latin">${esc(r.leg)}</td><td class="latin">${esc(shortPax(r.pax))}</td><td class="latin" title="${r.from} to ${r.to} hours">${r.ptype}</td>
      <td><span class="tag ${r.ba==='After'?'after':''} latin">${r.ba}</span></td>
      <td class="latin v-mod">${fmtPen(r.modAmt,r.modMode,r.cur)}${r.modDiff?`<div class="was">was ${fmtPen(r.prev.modAmt,r.prev.modMode,r.cur)}</div>`:''}</td><td class="latin v-ref">${fmtPen(r.refAmt,r.refMode,r.cur)}${r.refDiff?`<div class="was">was ${fmtPen(r.prev.refAmt,r.prev.refMode,r.cur)}</div>`:''}</td><td class="latin">${r.id===undefined?'—':esc(r.id)}</td></tr>`).join('')+'</tbody>';
  $('prev-count').textContent=rows.length>show.length?`First ${show.length} of ${rows.length} rows (${actSummary(rows)})`:`${plural(rows.length)} (${actSummary(rows)})`;

function drawBatch(){

  $('act').innerHTML=rows.length?`<span class="tag chg latin">${changed} Changed</span><span class="tag same latin">${same} Same</span><span class="tag add latin">${adds} New</span>`:'';

    return `<li class="batch-item"><div class="meta"><b>${r.fares.length} class × ${r.legs.length} leg</b> · ${plural(n)}
      <div class="sub2 latin">${esc(r.fares.slice(0,2).join(', '))}${r.fares.length>2?' +'+(r.fares.length-2):''}</div>
      <div class="sub2 latin">${esc(r.legs.slice(0,4).join(', '))}${r.legs.length>4?' +'+(r.legs.length-4):''}</div>
      <div class="sub2 latin">Before <span class="v-mod">${fmtPen(bf.mod.amt,bf.mod.mode,r.cur)}</span> / <span class="v-ref">${fmtPen(bf.ref.amt,bf.ref.mode,r.cur)}</span> · After <span class="v-mod">${fmtPen(af.mod.amt,af.mod.mode,r.cur)}</span> / <span class="v-ref">${fmtPen(af.ref.amt,af.ref.mode,r.cur)}</span></div>
      ${r.noshow?`<div class="sub2 latin">NoShow <span class="v-mod">${fmtPen(r.noshow.mod.amt,r.noshow.mod.mode,r.cur)}</span> / <span class="v-ref">${fmtPen(r.noshow.ref.amt,r.noshow.ref.mode,r.cur)}</span></div>`:''}</div>
      <button class="link" type="button" data-del="${i}" aria-label="Delete group">Delete</button></li>`;}).join('')
    :'<li class="empty-note" style="padding:6px 0">Empty</li>';
  $('btn-export').disabled=!rows.length;
  const st=$('status');
  if(overridden){st.className='status warn';st.textContent=`${overridden} duplicate ${overridden===1?'row':'rows'}: the latest replaced the earlier one.`;}
  else if(rows.length>5000){st.className='status warn';st.textContent='The original template is sized for 5,000 rows; this file has '+rows.length+'.';}
  else if(!st.dataset.keep){st.className='status';st.textContent='';}
}

function drawQuick(){
  const q=$('fare-quick'),all=QUICK_FARES.every(([,l])=>state.fares.has(l));
  q.innerHTML=QUICK_FARES.map(([k,l,n])=>
    `<button type="button" data-fare="${esc(l)}" aria-pressed="${state.fares.has(l)}" title="${esc(l)}"><b>${k}</b><span class="latin">${esc(n)}</span></button>`).join('')+
    `<button type="button" class="all" data-fare="*all" aria-pressed="${all}">Select all</button>`;
}
/* --- Agreement hint --- */
let agrApply=null;
const fmtN=n=>Number(n).toLocaleString('en-US');
function drawRates(){
  const on=state.cur==='SDG';$('sdg-rates').hidden=!on;
  if(on){if(document.activeElement!==$('sdg-out'))$('sdg-out').value=state.sdgOut;if(document.activeElement!==$('sdg-in'))$('sdg-in').value=state.sdgIn;}
}
function drawHint(){
  const box=$('agr-hint'),cur=state.cur,sel=[...state.legs],hits=sel.filter(l=>AGR_LEG.has(l));
  agrApply=null;
  if(!hits.length){box.hidden=true;box.innerHTML='';return;}
  const items=hits.map(l=>({a:AGR_LEG.get(l),legs:[l]}));
  const sigs=new Set(items.map(c=>JSON.stringify(agrVals(c.a,cur)||null)));
  const lines=items.map(c=>{
    const v=agrVals(c.a,cur),u=c.a.vals.USD;
    const shown=v?`<span class="v-mod">Modify ${fmtN(v[0])}</span> · <span class="v-ref">Refund ${fmtN(v[1])}</span> · No-show ${fmtN(v[2])} ${cur}`
      :`<span class="warn">No ${cur} value in the agreement</span> (USD: ${u[0]} / ${u[1]} / ${u[2]})`;
    return `<div class="ln"><b class="latin">${esc(c.legs[0])}</b> · ${c.a.dir}<br>${shown}</div>`;
  }).join('');
  let foot='',btn='';
  const only=sigs.size===1&&agrVals(items[0].a,cur)?agrVals(items[0].a,cur):null;
  if(sigs.size>1)foot='<div class="warn">The selected legs have different agreement values. Add them separately.</div>';
  else if(only){
    const [m,r,n]=only,P=state.pen,eq=(x,y)=>String(x.amt).trim()!==''&&Number(x.amt)===y&&x.mode==='Value';
    const match=['Before','After'].every(b=>eq(P[b].mod,m)&&eq(P[b].ref,r))&&state.noshowOn&&eq(P.NoShow.mod,n)&&eq(P.NoShow.ref,n);
    if(match)foot='<div class="ok">The form matches the agreement.</div>';
    else{agrApply=only;btn='<button type="button" id="agr-apply">Apply to form</button>';}
  }
  const miss=sel.length-hits.length;
  if(miss)foot+=`<div>${miss} selected leg${miss===1?' is':'s are'} not in the agreement.</div>`;
  const usable=hits.filter(l=>agrVals(AGR_LEG.get(l),cur)).length;
  const btn2=usable&&state.fares.size?`<button type="button" id="agr-add" class="primary">Add ${usable} leg${usable===1?'':'s'} to file by agreement</button>`:'';
  box.innerHTML=`<div class="h">Agreement hint (${cur})</div>${lines}${foot}<div class="agr-btns">${btn}${btn2}</div>`;
  box.hidden=false;
}
function drawExisting(){
  const n=state.existing.size,st=$('ex-status');
  st.className='ex-s '+(n?'good':'warn');
  st.textContent=n?`${n} penalties loaded${state.existingName?' from '+state.existingName:''}`:'Not imported: every row will be Add.';
  $('ex-clear').hidden=!(n&&state.imported);
}
function refresh(){drawRates();drawHint();drawExisting();drawQuick();drawPreview();drawBatch();save();}
function say(cls,txt){const s=$('status');s.className='status '+cls;s.textContent=txt;s.dataset.keep='1';setTimeout(()=>{delete s.dataset.keep;},4000);}

/* --- Wire up --- */
load();ensureNoShow();loadExisting();
/* Built-in penalties (ID table): data/penalties.json next to the page. An imported file overrides it. */
async function loadBuiltin(){
  if(state.imported&&state.existing.size)return;
  try{
    const r=await fetch('data/penalties.json',{cache:'no-store'}); if(!r.ok)return;
    const o=await r.json();
    state.existing=new Map(o.rows.map(([pt,fa,lg,px,ba,fr,to,cu,id,ma,mm,ra,rm])=>[rowKey(pt,fa,lg,px,FIXED.atype,ba,fr,to,cu),{id,modAmt:ma,modMode:mm,refAmt:ra,refMode:rm}]));
    state.existingName=(o.name||'data')+' (built-in)'; state.imported=false; refresh();
  }catch(e){}
}
const farePicker=makePicker($('fare-picker'),REF.fare.map(x=>x[0]),state.fares,'Search Farebasis',refresh);
const legPicker=makePicker($('leg-picker'),REF.leg.map(x=>x[0]),state.legs,'Search Leg, e.g. JED',refresh,l=>AGR_LEG.has(l)?'<span class="agr-b" title="In the agreement">Agreement</span>':'');
$('fare-quick').addEventListener('click',e=>{
  const b=e.target.closest('[data-fare]');if(!b)return;
  const v=b.dataset.fare;
  if(v==='*all'){const all=QUICK_FARES.every(([,l])=>state.fares.has(l));QUICK_FARES.forEach(([,l])=>all?state.fares.delete(l):state.fares.add(l));}
  else state.fares.has(v)?state.fares.delete(v):state.fares.add(v);
  farePicker.redraw();refresh();
});
drawPen('Before');drawPen('After');drawPen('NoShow');wirePen();
if([...state.fares].some(l=>!QUICK_FARES.some(q=>q[1]===l)))$('fare-more').open=true;
$('cur').innerHTML=ENABLED_CURRENCIES.map(c=>`<option value="${c}"${c===state.cur?' selected':''}>${c}</option>`).join('');
$('cur').addEventListener('change',e=>{state.cur=e.target.value;for(const b of ['Before','After','NoShow'])drawPen(b);refresh();});

$('btn-add').addEventListener('click',()=>{
  if(draftProblems().length)return;
  const rule=draftRule(); state.batch.push({rule}); refresh();
  say('ok',`Added ${plural(ruleRows(rule).length)} to the file.`);
});
$('batch-list').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;state.batch.splice(+b.dataset.del,1);refresh();});
for(const [id,k] of [['sdg-out','sdgOut'],['sdg-in','sdgIn']])
  $(id).addEventListener('input',e=>{const n=parseFloat(String(e.target.value).replace(/,/g,''));state[k]=n>0?n:0;refresh();});
$('agr-hint').addEventListener('click',e=>{
  if(e.target.id==='agr-add'){
    const by=new Map(),cur=state.cur;
    for(const l of state.legs){const a=AGR_LEG.get(l),v=a&&agrVals(a,cur);if(!v)continue;const k=v.join('|');if(!by.has(k))by.set(k,{v,legs:[]});by.get(k).legs.push(l);}
    let n=0,legsN=0;
    for(const {v,legs} of by.values()){
      const pv=(m,r)=>({mod:{amt:m,mode:'Value'},ref:{amt:r,mode:'Value'}});
      const pen={Before:pv(v[0],v[1]),After:pv(v[0],v[1])};
      const rule={fares:[...state.fares],legs,pen,noshow:pv(v[2],v[2]),cur};
      state.batch.push({rule});n+=ruleRows(rule).length;legsN+=legs.length;
    }
    refresh();say('ok',`Added ${plural(n)} to the file from the agreement (${legsN} leg${legsN===1?'':'s'}).`);return;
  }
  if(e.target.id!=='agr-apply'||!agrApply)return;
  const [m,r,n]=agrApply,P=state.pen,set=(x,v)=>{x.amt=String(v);x.mode='Value';};
  for(const b of ['Before','After']){set(P[b].mod,m);set(P[b].ref,r);}
  set(P.NoShow.mod,n);set(P.NoShow.ref,n);state.noshowOn=true;
  drawPen('Before');drawPen('After');drawPen('NoShow');refresh();
});
$('ex-btn').addEventListener('click',()=>$('ex-file').click());
$('ex-file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const {map,count}=parseExisting(await f.arrayBuffer());
    if(!map.size){say('bad','No penalty rows with IDs found in that file.');}
    else{
      // Merge: values from the new file overwrite old ones; penalties not in the file stay as they were.
      let changed=0,added=0;
      for(const [k,v] of map){
        const old=state.existing.get(k);
        if(!old)added++;
        else if(Number(old.modAmt)!==Number(v.modAmt)||old.modMode!==v.modMode||Number(old.refAmt)!==Number(v.refAmt)||old.refMode!==v.refMode||old.id!==v.id)changed++;
        state.existing.set(k,v);
      }
      state.existingName=f.name+' (latest import)';state.imported=true;saveExisting();refresh();
      say('ok',`Saved ${count} penalties from the file: ${changed} changed, ${added} new.`);
    }
  }catch(err){say('bad','Could not read the file: '+(err&&err.message?err.message:'Unknown error'));}
  e.target.value='';
});
$('ex-clear').addEventListener('click',()=>{state.existing=new Map();state.existingName='';state.imported=false;saveExisting();refresh();loadBuiltin();});
$('btn-clear').addEventListener('click',()=>{if(!state.batch.length)return;state.batch=[];refresh();say('ok','File cleared.');});

$('btn-export').addEventListener('click',async()=>{
  const {rows}=generateRows(state.batch.map(b=>b.rule),state.existing); if(!rows.length)return;
  let dl=null; try{dl=window.claude?await claude.use('downloads'):null;}catch(e){}
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const name=`Penalties_Export_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.xlsx`;
  if(!dl){  // standalone hosting (e.g. GitHub Pages): plain browser download
    try{
      const url=URL.createObjectURL(new Blob([toXlsxBuffer(rows)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      say('ok',`Saved ${name} (${plural(rows.length)}).`);
    }catch(err){say('bad','Could not save the file: '+(err&&err.message?err.message:'Unknown error'));}
    return;
  }
  try{
    await dl.save({filename:name,data:toXlsxBuffer(rows)});
    say('ok',`Saved ${name} (${plural(rows.length)}).`);
  }catch(err){
    if(err&&err.code==='declined')say('warn','Save cancelled.');
    else say('bad','Could not save the file: '+(err&&err.message?err.message:'Unknown error'));
  }
});
refresh();loadBuiltin();
/* Hooks for the optional cloud layer (cloud.js, standalone hosting only) */
window.PenApp={state,fixFare,refresh,drawPen,ensureNoShow,loadBuiltin,redrawPickers(){
  /* The reference lists can change after load (legs added or deleted in Settings): rebuild the pickers and drop selections that no longer exist. */
  for(const l of [...state.legs])if(!CODE.leg.has(l))state.legs.delete(l);
  for(const f of [...state.fares])if(!CODE.fare.has(f))state.fares.delete(f);
  legPicker.setItems(REF.leg.map(x=>x[0]));farePicker.setItems(REF.fare.map(x=>x[0]));
}};
document.dispatchEvent(new Event('penapp-ready'));
</script>

<script type="module" src="cloud.js"></script>
</body>
